name: Build

on:
  push:
    branches:
      - main
      - feat/goal-bar
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # Key on the buildspec "dependencies" section only, so a version bump keeps the cache.
      - name: Compute OBS dependencies key
        id: deps-key
        run: |
          $deps = (Get-Content buildspec.json -Raw | ConvertFrom-Json).dependencies | ConvertTo-Json -Depth 10 -Compress
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($deps)
          $hash = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::HashData($bytes)).Replace('-', '').ToLower()
          "hash=$hash" >> $env:GITHUB_OUTPUT

      # restore-keys falls back to the newest deps cache; the buildspec hash check in
      # configure re-downloads only what actually changed.
      - name: Restore OBS dependencies
        id: restore-deps
        uses: actions/cache/restore@v6
        with:
          path: .deps
          key: deps-windows-x64-${{ steps.deps-key.outputs.hash }}-${{ hashFiles('cmake/common/buildspec_common.cmake', 'cmake/windows/buildspec.cmake') }}
          restore-keys: |
            deps-windows-x64-

      # Configure downloads OBS sources and obs-deps from GitHub; retry transient HTTP errors.
      - name: Configure
        run: |
          foreach ($attempt in 1..3) {
            cmake --preset windows-x64
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Configure attempt $attempt failed; retrying in 30 s"
            Remove-Item -Recurse -Force build_windows -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 30
          }
          exit 1

      # Saved right after configure, which builds libobs, so that a plugin compile error
      # does not throw away the slowest step of the job.
      - name: Save OBS dependencies
        if: steps.restore-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .deps
          key: ${{ steps.restore-deps.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset windows-x64

      - name: Test
        run: |
          cmake -S tests -B build_tests -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build_tests --config RelWithDebInfo --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build_tests -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package
        run: |
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          $package = "obs-goal-bar-$version-windows-x64.zip"
          cmake --install build_windows --config RelWithDebInfo --prefix stage/obs-goal-bar
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path stage/obs-goal-bar/bin/64bit/obs-goal-bar.dll)) {
            Get-ChildItem -Recurse stage | Select-Object -ExpandProperty FullName
            throw "obs-goal-bar.dll is missing from the install tree"
          }
          @(
            "OBS Goal Bar $version for Windows x64, built against OBS 33.0.1."
            "Close OBS, then extract the obs-goal-bar folder into:"
            "  C:\ProgramData\obs-studio\plugins\"
            "The Twitch refresh token is kept in the Windows Credential Manager."
          ) | Set-Content stage/obs-goal-bar/INSTALL.txt
          Compress-Archive -Path stage/obs-goal-bar -DestinationPath $package
          "PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v7
        with:
          name: obs-goal-bar-windows-x64
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # libobs and obs-frontend-api come from the OBS Project PPA, which only keeps its latest
      # build, so the OBS version is whatever it publishes for this Ubuntu release. The
      # Package step records that version in INSTALL.txt.
      - name: Install dependencies
        run: |
          sudo add-apt-repository --yes ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libcurl4-openssl-dev libsecret-1-dev libsimde-dev ninja-build obs-studio pkg-config qt6-base-dev
          dpkg-query --show obs-studio

      # Configure downloads nlohmann/json from GitHub; retry transient HTTP errors.
      - name: Configure
        run: |
          for attempt in 1 2 3; do
            cmake --preset linux-x86_64 && exit 0
            echo "Configure attempt $attempt failed; retrying in 30 s"
            rm -rf build_linux
            sleep 30
          done
          exit 1

      - name: Build
        run: cmake --build --preset linux-x86_64

      - name: Test
        run: |
          cmake -S tests -B build_tests -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build_tests
          ctest --test-dir build_tests --output-on-failure

      - name: Package
        run: |
          version="$(jq -r .version buildspec.json)"
          obs_version="$(dpkg-query --show --showformat='${Version}' obs-studio)"
          package="obs-goal-bar-${version}-linux-x86_64.tar.gz"
          cmake --install build_linux --prefix stage/obs-goal-bar
          test -f stage/obs-goal-bar/bin/64bit/obs-goal-bar.so
          cat > stage/obs-goal-bar/INSTALL.txt <<EOF
          OBS Goal Bar ${version} for Linux x86_64, built on Ubuntu 24.04 against OBS ${obs_version}.
          Close OBS, then run:
            mkdir -p ~/.config/obs-studio/plugins
            tar -xzf ${package} -C ~/.config/obs-studio/plugins
          Twitch login needs libsecret and a running Secret Service such as GNOME Keyring or KWallet.
          Without one, the Twitch refresh token cannot be saved; it is never kept in plain text.
          EOF
          tar -C stage -czf "${package}" obs-goal-bar
          echo "PACKAGE=${package}" >> "${GITHUB_ENV}"

      - uses: actions/upload-artifact@v7
        with:
          name: obs-goal-bar-linux-x86_64
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
